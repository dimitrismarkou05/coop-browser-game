<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test V1</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0d1117;
        color: #e6edf3;
        user-select: none;
      }
      #hud {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 12px 14px;
        border-radius: 8px;
        background: rgba(13, 17, 23, 0.82);
        border: 1px solid #30363d;
        min-width: 240px;
        line-height: 1.45;
        font-size: 14px;
        pointer-events: none;
        display: none;
      }
      #hud.visible {
        display: block;
      }
      #hud .label {
        color: #8b949e;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #status.connected {
        color: #3fb950;
      }
      #status.disconnected {
        color: #f85149;
      }
      #status.connecting {
        color: #d29922;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        z-index: 9;
        pointer-events: none;
        display: none;
      }
      #crosshair.visible {
        display: block;
      }
      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
      }
      #crosshair::before {
        left: 10px;
        top: 2px;
        width: 2px;
        height: 18px;
      }
      #crosshair::after {
        left: 2px;
        top: 10px;
        width: 18px;
        height: 2px;
      }
      #crosshair .dot {
        position: absolute;
        left: 9px;
        top: 9px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55);
      }
      #lobby {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at top, #1a2332 0%, #0d1117 55%),
          #0d1117;
      }
      #lobby.hidden {
        display: none;
      }
      .panel {
        width: min(420px, calc(100vw - 32px));
        padding: 28px 24px;
        border: 1px solid #30363d;
        border-radius: 12px;
        background: rgba(22, 27, 34, 0.95);
      }
      .panel h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 650;
      }
      .panel p {
        margin: 0 0 20px;
        color: #8b949e;
        font-size: 14px;
      }
      label {
        display: block;
        margin: 0 0 6px;
        color: #8b949e;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input {
        width: 100%;
        margin-bottom: 14px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #30363d;
        background: #0d1117;
        color: #e6edf3;
        font-size: 15px;
      }
      input:focus {
        outline: 1px solid #3d9a5f;
        border-color: #3d9a5f;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 1;
        padding: 11px 14px;
        border: none;
        border-radius: 8px;
        background: #3d9a5f;
        color: #04140a;
        font-weight: 650;
        font-size: 14px;
        cursor: pointer;
      }
      button.secondary {
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
      }
      button:hover {
        filter: brightness(1.08);
      }
      #lobby-status {
        margin-top: 14px;
        min-height: 1.2em;
        font-size: 13px;
        color: #8b949e;
      }
      #lobby-status.error {
        color: #f85149;
      }
      #lobby-net {
        margin-top: 8px;
        font-size: 12px;
        color: #8b949e;
      }
      #hint {
        max-width: 260px;
      }
      #hp-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #hp-bar {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: #21262d;
        overflow: hidden;
        border: 1px solid #30363d;
      }
      #hp-fill {
        height: 100%;
        width: 100%;
        background: #3d9a5f;
        transition: width 0.1s linear, background 0.1s linear;
      }
      #hp-fill.hurt {
        background: #d29922;
      }
      #hp-fill.critical {
        background: #f85149;
      }
      #hurt-flash {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 40%, rgba(180, 20, 20, 0.45));
        opacity: 0;
        transition: opacity 0.15s ease;
      }
      #hurt-flash.on {
        opacity: 1;
      }
      #hit-marker {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        z-index: 11;
        pointer-events: none;
        opacity: 0;
        border: 2px solid #f0f6fc;
        transform: rotate(45deg) scale(0.6);
        transition: opacity 0.12s ease;
      }
      #hit-marker.on {
        opacity: 0.95;
      }
      #prompt {
        position: fixed;
        left: 50%;
        bottom: 18%;
        transform: translateX(-50%);
        z-index: 12;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(13, 17, 23, 0.85);
        border: 1px solid #30363d;
        font-size: 14px;
        display: none;
        pointer-events: none;
      }
      #prompt.visible {
        display: block;
      }
      #revive-hud {
        position: fixed;
        left: 50%;
        bottom: 24%;
        transform: translateX(-50%);
        z-index: 12;
        width: min(280px, 70vw);
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(13, 17, 23, 0.9);
        border: 1px solid #3d9a5f;
        display: none;
        pointer-events: none;
      }
      #revive-hud.visible {
        display: block;
      }
      #revive-hud .label {
        font-size: 12px;
        color: #8b949e;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #revive-bar {
        height: 10px;
        border-radius: 999px;
        background: #21262d;
        overflow: hidden;
        border: 1px solid #30363d;
      }
      #revive-fill {
        height: 100%;
        width: 0%;
        background: #3d9a5f;
        transition: width 0.08s linear;
      }
      #revive-time {
        margin-top: 6px;
        font-size: 13px;
        color: #e6edf3;
      }
      #dev-console {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        z-index: 40;
        display: none;
        flex-direction: column;
        max-width: 720px;
        margin: 0 auto;
        background: rgba(8, 12, 18, 0.94);
        border: 1px solid #30363d;
        border-radius: 10px;
        overflow: hidden;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #dev-console.open {
        display: flex;
      }
      #dev-console .dev-log {
        max-height: 180px;
        overflow: auto;
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.45;
        color: #c9d1d9;
      }
      #dev-console .dev-line.cmd { color: #79c0ff; }
      #dev-console .dev-line.ok { color: #3fb950; }
      #dev-console .dev-line.err { color: #f85149; }
      #dev-console .dev-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-top: 1px solid #30363d;
      }
      #dev-console .dev-prompt { color: #3d9a5f; }
      #dev-console .dev-input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: #e6edf3;
        font: inherit;
        margin: 0;
        padding: 4px 0;
      }
      #dev-console .dev-hint {
        padding: 0 12px 8px;
        font-size: 11px;
        color: #8b949e;
      }
      #downed-banner {
        position: fixed;
        left: 50%;
        top: 18%;
        transform: translateX(-50%);
        z-index: 12;
        padding: 12px 16px;
        border-radius: 8px;
        background: rgba(120, 20, 20, 0.88);
        border: 1px solid #f85149;
        font-size: 15px;
        display: none;
        pointer-events: none;
        text-align: center;
      }
      #downed-banner.visible {
        display: block;
      }
      #loot-toast {
        position: fixed;
        left: 50%;
        top: 12%;
        transform: translateX(-50%);
        z-index: 13;
        padding: 10px 14px;
        border-radius: 8px;
        background: rgba(13, 17, 23, 0.9);
        border: 1px solid #3d9a5f;
        font-size: 14px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
      }
      #loot-toast.on {
        opacity: 1;
      }
      :root {
        --slot: 52px;
      }
      #hotbar {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 14;
        display: none;
        grid-template-columns: repeat(6, var(--slot));
        gap: 4px;
        padding: 6px;
        background: rgba(13, 17, 23, 0.82);
        border: 1px solid #30363d;
        border-radius: 10px;
        pointer-events: auto;
      }
      #hotbar.visible {
        display: grid;
      }
      #vitals {
        position: fixed;
        left: 50%;
        bottom: 80px;
        transform: translateX(-50%);
        z-index: 14;
        display: none;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-end;
        gap: 12px;
        width: calc(6 * var(--slot) + 5 * 4px);
        padding: 0;
        background: transparent;
        border: none;
        pointer-events: none;
      }
      #vitals.visible {
        display: flex;
      }
      #hearts,
      #food-icons {
        display: flex;
        flex-direction: row;
        gap: 3px;
        width: calc(3 * var(--slot) + 2 * 4px);
      }
      #food-icons {
        flex-direction: row-reverse;
        justify-content: flex-start;
      }
      .mc-pip {
        width: calc((3 * var(--slot) + 2 * 4px - 4 * 3px) / 5 * 0.88);
        height: calc((3 * var(--slot) + 2 * 4px - 4 * 3px) / 5 * 0.88);
        image-rendering: pixelated;
        flex-shrink: 0;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.65));
      }
      .inv-slot {
        width: var(--slot);
        height: var(--slot);
        border: 2px solid #30363d;
        border-radius: 6px;
        background: #161b22;
        position: relative;
        cursor: pointer;
        user-select: none;
        box-sizing: border-box;
      }
      .inv-slot.filled {
        background: color-mix(in srgb, var(--item, #3d9a5f) 35%, #161b22);
        border-color: color-mix(in srgb, var(--item, #3d9a5f) 55%, #30363d);
      }
      .inv-slot.selected {
        border-color: #e6edf3;
        box-shadow: inset 0 0 0 1px #e6edf3;
      }
      .inv-slot .slot-icon {
        position: absolute;
        inset: 4px;
        width: calc(100% - 8px);
        height: calc(100% - 8px);
        object-fit: contain;
        pointer-events: none;
        image-rendering: pixelated;
      }
      .inv-slot .slot-count {
        position: absolute;
        right: 3px;
        bottom: 2px;
        font-size: 11px;
        font-weight: 700;
        color: #e6edf3;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      .inv-slot .slot-label {
        display: none;
      }
      .inv-slot .slot-num {
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 9px;
        color: #8b949e;
        pointer-events: none;
        z-index: 1;
      }
      #inv-ui {
        position: fixed;
        inset: 0;
        z-index: 25;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 18, 0.72);
        pointer-events: auto;
      }
      #inv-ui.open {
        display: flex;
      }
      #inv-panel {
        width: min(560px, calc(100vw - 24px));
        padding: 18px 16px 16px;
        border: 1px solid #30363d;
        border-radius: 12px;
        background: rgba(22, 27, 34, 0.97);
      }
      #inv-title {
        margin: 0 0 12px;
        font-size: 16px;
        font-weight: 650;
      }
      #inv-container-grid,
      #inv-player-grid,
      #inv-hotbar-grid {
        display: grid;
        gap: 4px;
        justify-content: center;
        margin-bottom: 14px;
      }
      #inv-hotbar-grid {
        margin-bottom: 4px;
        padding-top: 8px;
        border-top: 1px solid #30363d;
      }
      #inv-player-label,
      #inv-hotbar-label,
      #inv-container-label {
        margin: 0 0 8px;
        color: #8b949e;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #inv-ui.open ~ #hotbar,
      #inv-ui.open ~ #vitals,
      body:has(#inv-ui.open) #hotbar,
      body:has(#inv-ui.open) #vitals {
        display: none !important;
      }
      .inv-empty {
        color: #8b949e;
        font-size: 13px;
        padding: 12px;
        text-align: center;
      }
      #inv-ghost {
        position: fixed;
        z-index: 30;
        pointer-events: none;
        display: none;
        padding: 6px 8px;
        border-radius: 6px;
        font-size: 11px;
        color: #04140a;
        font-weight: 650;
        max-width: 120px;
      }
      #inv-ghost.on {
        display: block;
      }
      #inv-hint {
        margin-top: 8px;
        font-size: 12px;
        color: #8b949e;
        text-align: center;
      }
      #invasion-hud {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 12;
        min-width: 220px;
        padding: 10px 16px;
        border-radius: 10px;
        background: rgba(13, 17, 23, 0.88);
        border: 1px solid #30363d;
        text-align: center;
        pointer-events: none;
        display: none;
        line-height: 1.4;
      }
      #invasion-hud.visible {
        display: block;
      }
      #invasion-phase {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0.03em;
      }
      #invasion-meta {
        margin-top: 4px;
        font-size: 12px;
        color: #8b949e;
      }
      #invasion-ready {
        margin-top: 4px;
        font-size: 12px;
        color: #3fb950;
      }
      #base-hud {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 12;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(13, 17, 23, 0.82);
        border: 1px solid #30363d;
        font-size: 12px;
        line-height: 1.45;
        pointer-events: none;
        display: none;
        min-width: 150px;
      }
      #base-hud.visible {
        display: block;
      }
      #base-hud .label {
        color: #8b949e;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      #compass {
        position: fixed;
        bottom: 120px;
        right: 20px;
        z-index: 12;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(13, 17, 23, 0.75);
        border: 1px solid #30363d;
        display: none;
        pointer-events: none;
      }
      #compass.visible {
        display: block;
      }
      #compass-arrow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        margin: -14px 0 0 -8px;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 18px solid #3d9a5f;
        transform-origin: 50% 14px;
      }
      #compass-label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 4px;
        text-align: center;
        font-size: 9px;
        color: #8b949e;
        letter-spacing: 0.06em;
      }
      #summary-overlay {
        position: fixed;
        inset: 0;
        z-index: 35;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(8, 12, 18, 0.72);
        pointer-events: none;
      }
      #summary-overlay.visible {
        display: flex;
      }
      #summary-card {
        padding: 28px 32px;
        border-radius: 12px;
        border: 1px solid #30363d;
        background: rgba(22, 27, 34, 0.96);
        text-align: center;
        max-width: 360px;
      }
      #summary-card.win {
        border-color: #3d9a5f;
      }
      #summary-card.lose {
        border-color: #f85149;
      }
      #summary-title {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 650;
      }
      #summary-body {
        margin: 0;
        color: #8b949e;
        font-size: 14px;
      }
      #siren-flash {
        position: fixed;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 35%, rgba(180, 20, 20, 0.55));
        opacity: 0;
      }
      #siren-flash.on {
        animation: siren-pulse 0.7s ease-in-out 3;
      }
      @keyframes siren-pulse {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <div class="panel">
        <h1>Test V1</h1>
        <label for="name">Display name</label>
        <input id="name" maxlength="16" placeholder="Survivor" autocomplete="off" list="name-history" />
        <datalist id="name-history"></datalist>
        <label for="code">Invite code (join)</label>
        <input id="code" maxlength="6" placeholder="ABC123" autocomplete="off" style="text-transform: uppercase" />
        <div class="row">
          <button type="button" id="btn-create">Create room</button>
          <button type="button" class="secondary" id="btn-join">Join room</button>
        </div>
        <div id="lobby-status"></div>
        <div id="lobby-net">WebSocket: connecting…</div>
      </div>
    </div>

    <div id="hud">
      <div class="label">Room</div>
      <div id="room-code">—</div>
      <div class="label" style="margin-top: 8px">WebSocket</div>
      <div id="status" class="connecting">Connecting…</div>
      <div class="label" style="margin-top: 8px">Ping</div>
      <div id="rtt">—</div>
      <div class="label" style="margin-top: 8px">Players</div>
      <div id="player-count">—</div>
    </div>
    <div id="invasion-hud">
      <div id="invasion-phase">PREP</div>
      <div id="invasion-meta">Invasion 1 · —</div>
      <div id="invasion-ready">Ready 0 / 0 · R to toggle</div>
    </div>
    <div id="base-hud">
      <div class="label">Core</div>
      <div id="base-core">—</div>
      <div class="label" style="margin-top: 6px">Walls</div>
      <div id="base-walls">—</div>
      <div class="label" style="margin-top: 6px">Tiers</div>
      <div id="base-tiers">—</div>
    </div>
    <div id="compass" aria-hidden="true">
      <div id="compass-arrow"></div>
      <div id="compass-label">BASE</div>
    </div>
    <div id="summary-overlay" aria-hidden="true">
      <div id="summary-card">
        <h2 id="summary-title">Invasion</h2>
        <p id="summary-body"></p>
      </div>
    </div>
    <div id="siren-flash" aria-hidden="true"></div>
    <div id="vitals">
      <div id="hearts" aria-label="Health"></div>
      <div id="food-icons" aria-label="Hunger"></div>
    </div>
    <div id="hotbar"></div>
    <div id="inv-ui">
      <div id="inv-panel">
        <h2 id="inv-title">Inventory</h2>
        <div id="inv-container-label" hidden>Container</div>
        <div id="inv-container-grid"></div>
        <div id="inv-player-label">Inventory</div>
        <div id="inv-player-grid"></div>
        <div id="inv-hotbar-label">Hotbar</div>
        <div id="inv-hotbar-grid"></div>
        <div id="inv-hint">Drag or Shift-click to move · Esc to close · 1–6 select hotbar</div>
      </div>
    </div>
    <div id="inv-ghost"></div>
    <div id="loot-toast"></div>
    <div id="prompt"></div>
    <div id="revive-hud">
      <div class="label">Reviving</div>
      <div id="revive-bar"><div id="revive-fill"></div></div>
      <div id="revive-time">0.0 / 5.0s</div>
    </div>
    <div id="downed-banner"></div>
    <div id="hurt-flash" aria-hidden="true"></div>
    <div id="hit-marker" aria-hidden="true"></div>
    <div id="crosshair" aria-hidden="true"><div class="dot"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
