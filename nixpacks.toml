# Belmo free tier uses Nixpacks only (Dockerfile = Pro).
# Leave Belmo Build/Start commands EMPTY so this file is used.
# If Build is set to `npm ci && ...`, Coolify remounts node_modules/.cache and npm ci fails with EBUSY.

[variables]
NPM_CONFIG_PRODUCTION = "false"
NIXPACKS_NODE_VERSION = "22"

[phases.setup]
nixPkgs = ["nodejs_22", "npm-9_x"]
aptPkgs = ["python3", "make", "g++", "curl", "wget"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
# Install already ran npm ci — do NOT run npm ci again here.
cmds = [
  "npm run build -w @coop/shared",
  "npm run build -w @coop/server",
]

[start]
cmd = "npm run start -w @coop/server"
